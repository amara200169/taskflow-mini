<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow Mini</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 42px 16px; background: #f3f6fb; color: #1f2937; font-family: Arial, sans-serif; }
    main { max-width: 640px; margin: auto; background: white; border-radius: 18px; padding: 30px; box-shadow: 0 10px 34px rgba(28, 50, 90, .08); }
    h1 { margin: 0; color: #184e8a; }
    .subtitle { color: #667085; margin: 9px 0 26px; }
    .add-form { display: flex; gap: 10px; margin-bottom: 28px; }
    input { flex: 1; min-width: 0; padding: 12px; border: 1px solid #cbd5e1; border-radius: 9px; font: inherit; }
    button { cursor: pointer; padding: 12px 16px; border: 0; border-radius: 9px; font: inherit; }
    .add-btn { background: #2563eb; color: white; }
    .delete-btn { background: #fee2e2; color: #991b1b; padding: 9px 12px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #edf0f5; }
    .task-text { overflow-wrap: anywhere; }
    .empty { color: #667085; padding: 16px 0; }
    @media(max-width: 480px) { main { padding: 20px; } .add-form { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <h1>TaskFlow</h1>
    <p class="subtitle">Your simple task manager</p>
    <!-- HTML forms send requests directly to Flask: no JavaScript required. -->
    <form class="add-form" action="{{ url_for('add_task') }}" method="POST">
      <input type="text" name="task" placeholder="What do you need to do?" maxlength="200" required aria-label="New task">
      <button class="add-btn" type="submit">Add Task</button>
    </form>
    <h2>My Tasks ({{ tasks|length }})</h2>
    {% if tasks %}
    <ul>
      {% for task in tasks %}
      <li>
        <span class="task-text">{{ task }}</span>
        <form action="{{ url_for('delete_task', task_id=loop.index0) }}" method="POST">
          <button class="delete-btn" type="submit" aria-label="Delete {{ task }}">Delete</button>
        </form>
      </li>
      {% endfor %}
    </ul>
    {% else %}
      <p class="empty">No tasks yet. Add your first one above.</p>
    {% endif %}
  </main>
</body>
</html>
